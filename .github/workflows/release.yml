name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Test
        run: go test ./...
      - name: Build archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          go build -trimpath -ldflags "-s -w" -o dist/package/soft-ue-index.exe ./cmd/soft-ue-index
          Copy-Item README.md, LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/soft-ue-index-windows-amd64.zip"
          $hash = (Get-FileHash "dist/soft-ue-index-windows-amd64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  soft-ue-index-windows-amd64.zip" | Set-Content -NoNewline dist/soft-ue-index-windows-amd64.zip.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/soft-ue-index-windows-amd64.zip
            dist/soft-ue-index-windows-amd64.zip.sha256
