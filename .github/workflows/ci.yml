name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - uses: msys2/setup-msys2@4f806de0a5a7294ffabaff804b38a9b435a73bda # v2.30.0
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Verify formatting
        shell: pwsh
        run: |
          $unformatted = & gofmt -l (Get-ChildItem -Recurse -Filter *.go | ForEach-Object FullName)
          if ($unformatted) { $unformatted; throw 'gofmt reported unformatted files' }
      - name: Verify module files
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '1'
          $env:CC = 'C:\msys64\mingw64\bin\gcc.exe'
          go test -race ./...
      - name: Build Windows x64 binary
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -o dist/soft-ue-index.exe ./cmd/soft-ue-index
      - name: Upload Windows binary
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soft-ue-index-windows-amd64
          path: dist/soft-ue-index.exe
          retention-days: 7
