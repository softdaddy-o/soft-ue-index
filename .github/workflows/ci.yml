name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Verify formatting
        shell: pwsh
        run: |
          $unformatted = & gofmt -l (Get-ChildItem -Recurse -Filter *.go | ForEach-Object FullName)
          if ($unformatted) { $unformatted; throw 'gofmt reported unformatted files' }
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        shell: msys2 {0}
        run: CC=gcc go test -race ./...
      - name: Build Windows x64 binary
        shell: pwsh
        run: |
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -o dist/soft-ue-index.exe ./cmd/soft-ue-index
      - name: Upload Windows binary
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: soft-ue-index-windows-amd64
          path: dist/soft-ue-index.exe
          retention-days: 7
